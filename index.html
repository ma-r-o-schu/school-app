                    if (window.innerWidth < 1024) toggleSidebar();
                };

                card.className = `p-3.5 rounded-2xl cursor-pointer transition-all border ${
                    isActive 
                    ? 'bg-indigo-50 border-indigo-300 shadow-sm ring-2 ring-indigo-500/20' 
                    : 'bg-white border-slate-200/80 hover:border-indigo-200 hover:bg-slate-50'
                }`;

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-1.5">
                        <span class="text-[10px] uppercase tracking-wider font-extrabold px-2 py-0.5 rounded-md ${badgeColor}">
                            ${topic.subjectName}
                        </span>
                        ${percent === 100 
                            ? '<span class="text-xs text-emerald-600 font-bold"><i class="fas fa-check-circle"></i> Fertig</span>' 
                            : `<span class="text-xs font-semibold text-slate-400">${percent}%</span>`
                        }
                    </div>
                    <h3 class="text-sm font-bold text-slate-800 leading-snug">${topic.title}</h3>
                    <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${topic.subtitle}</p>
                    
                    <div class="w-full bg-slate-100 rounded-full h-1.5 mt-2.5 overflow-hidden">
                        <div class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function renderActiveTopic() {
            const topic = CURRICULUM_DATA.find(t => t.id === currentTopicId);
            if (!topic) return;

            const display = document.getElementById('content-display');

            display.innerHTML = `
                <!-- Topic Header -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 mb-6 no-print">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full ${
                            topic.subject === 'deutsch' ? 'bg-blue-100 text-blue-800' :
                            topic.subject === 'mathe' ? 'bg-amber-100 text-amber-900' : 'bg-emerald-100 text-emerald-800'
                        }">
                            Bayern • LehrplanPlus • ${topic.subjectName}
                        </span>
                        <div class="flex items-center space-x-2 text-xs font-semibold text-slate-500">
                            <i class="fas fa-book-open"></i>
                            <span>3. Klasse</span>
                        </div>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${topic.title}</h2>
                    <p class="text-slate-600 text-base mt-1">${topic.subtitle}</p>

                    <!-- Navigation Tabs -->
                    <div class="flex flex-wrap border-b border-slate-200 mt-6 gap-2" id="nav-tabs">
                        <button onclick="switchTab('explanation')" class="pb-3 px-4 font-bold text-sm transition-all border-b-2 ${
                            activeTab === 'explanation' 
                            ? 'border-indigo-600 text-indigo-600' 
                            : 'border-transparent text-slate-500 hover:text-slate-800'
                        }">
                            📖 1. Erläuterung & Video
                        </button>
                        <button onclick="switchTab('exercises')" class="pb-3 px-4 font-bold text-sm transition-all border-b-2 ${
                            activeTab === 'exercises' 
                            ? 'border-indigo-600 text-indigo-600' 
                            : 'border-transparent text-slate-500 hover:text-slate-800'
                        }">
                            ✏️ 2. Vertiefungsübungen
                        </button>
                        <button onclick="switchTab('homework')" class="pb-3 px-4 font-bold text-sm transition-all border-b-2 ${
                            activeTab === 'homework' 
                            ? 'border-indigo-600 text-indigo-600' 
                            : 'border-transparent text-slate-500 hover:text-slate-800'
                        }">
                            📄 3. Hausaufgabenblätter
                        </button>
                    </div>
                </div>

                <!-- Tab Content Render Zone -->
                <div id="tab-content-zone"></div>
            `;

            if (activeTab === 'explanation') renderExplanationTab(topic);
            if (activeTab === 'exercises') renderExercisesTab(topic);
            if (activeTab === 'homework') renderHomeworkTab(topic);
        }

        function switchTab(tabName) {
            activeTab = tabName;
            renderActiveTopic();
        }

        function renderExplanationTab(topic) {
            const zone = document.getElementById('tab-content-zone');
            
            let pointsHtml = topic.explanation.points.map(p => `
                <li class="flex items-start space-x-3 text-slate-700">
                    <span class="text-indigo-500 mt-1"><i class="fas fa-check-circle"></i></span>
                    <span class="text-base leading-relaxed">${p}</span>
                </li>
            `).join('');

            let termsHtml = topic.explanation.keyTerms.map(kt => `
                <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100">
                    <span class="font-bold text-indigo-950 text-sm block">${kt.term}</span>
                    <span class="text-slate-600 text-xs mt-1 block">${kt.def}</span>
                </div>
            `).join('');

            zone.innerHTML = `
                <div class="space-y-6">
                    <!-- Merkkasten -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-lg">
                                💡
                            </div>
                            <h3 class="text-xl font-bold text-slate-900">Merkwissen & Erklärungen</h3>
                        </div>
                        
                        <p class="text-slate-700 font-medium mb-4">${topic.explanation.summary}</p>
                        
                        <ul class="space-y-3 mb-6">
                            ${pointsHtml}
                        </ul>

                        <h4 class="font-bold text-slate-800 text-sm uppercase tracking-wider mb-3">Wichtige Fachbegriffe:</h4>
                        <div class="grid sm:grid-cols-2 gap-3">
                            ${termsHtml}
                        </div>
                    </div>

                    <!-- Video Container -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg">
                                    <i class="fab fa-youtube"></i>
                                </div>
                                <div>
                                    <h3 class="text-xl font-bold text-slate-900">Erklärvideo zum Thema</h3>
                                    <p class="text-xs text-slate-500">Anschauliche Erklärung für Grundschüler</p>
                                </div>
                            </div>
                            <a href="https://www.youtube.com/watch?v=${topic.videoId}" target="_blank" class="hidden sm:flex items-center text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-2 rounded-xl">
                                <span>Auf YouTube öffnen</span>
                                <i class="fas fa-external-link-alt ml-1.5"></i>
                            </a>
                        </div>

                        <div class="video-container shadow-lg rounded-2xl">
                            <iframe src="https://www.youtube.com/embed/${topic.videoId}" title="Lernvideo ${topic.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>

                        <div class="mt-4 sm:hidden text-center">
                            <a href="https://www.youtube.com/watch?v=${topic.videoId}" target="_blank" class="inline-flex items-center text-xs font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-xl">
                                <span>Video extern auf YouTube öffnen</span>
                                <i class="fas fa-external-link-alt ml-1.5"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExercisesTab(topic) {
            const zone = document.getElementById('tab-content-zone');

            const diffList = topic.exercises[currentDifficulty] || [];

            let exercisesHtml = diffList.map((ex, index) => {
                const isDone = completedExercises[ex.id] || false;

                let inputHtml = '';
                if (ex.type === 'mc') {
                    inputHtml = `
                        <div class="grid sm:grid-cols-2 gap-2 mt-3">
                            ${ex.options.map(opt => `
                                <button onclick="checkMC('${ex.id}', '${opt}', '${ex.answer}')" class="p-3 text-left rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 font-semibold text-slate-700 transition-all text-sm flex items-center justify-between">
                                    <span>${opt}</span>
                                    <i class="far fa-circle text-slate-300"></i>
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else {
                    inputHtml = `
                        <div class="flex gap-2 mt-3">
                            <input type="text" id="input-${ex.id}" placeholder="Deine Antwort hier eingeben..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            <button onclick="checkInput('${ex.id}', '${ex.answer}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all shadow-sm">
                                Prüfen
                            </button>
                        </div>
                    `;
                }

                return `
                    <div id="ex-card-${ex.id}" class="bg-white rounded-3xl p-6 shadow-sm border ${isDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200/80'} transition-all">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Aufgabe ${index + 1}</span>
                            <span id="badge-${ex.id}" class="${isDone ? 'inline-block' : 'hidden'} text-xs font-extrabold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">
                                <i class="fas fa-check"></i> Richtig gelöst
                            </span>
                        </div>
                        
                        <p class="text-base font-bold text-slate-900">${ex.task}</p>
                        
                        ${ex.hint ? `<p class="text-xs text-amber-700 bg-amber-50 px-3 py-1.5 rounded-lg inline-block mt-2 font-medium"><i class="far fa-lightbulb mr-1"></i> Tipp: ${ex.hint}</p>` : ''}

                        ${inputHtml}

                        <!-- Solution & Explanation Box -->
                        <div id="feedback-${ex.id}" class="hidden mt-4 p-4 rounded-2xl text-sm"></div>
                    </div>
                `;
            }).join('');

            zone.innerHTML = `
                <div class="space-y-6">
                    <!-- Difficulty Selector Header -->
                    <div class="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg">Differenzierte Übungen</h3>
                            <p class="text-xs text-slate-500">Wähle deine passende Anforderungsstufe</p>
                        </div>

                        <div class="flex bg-slate-100 p-1 rounded-2xl text-xs font-bold">
                            <button onclick="setDifficulty('basis')" class="px-4 py-2 rounded-xl transition-all ${
                                currentDifficulty === 'basis' ? 'bg-emerald-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                            }">
                                🟢 Basis
                            </button>
                            <button onclick="setDifficulty('standard')" class="px-4 py-2 rounded-xl transition-all ${
                                currentDifficulty === 'standard' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                            }">
                                🟡 Standard
                            </button>
                            <button onclick="setDifficulty('forder')" class="px-4 py-2 rounded-xl transition-all ${
                                currentDifficulty === 'forder' ? 'bg-rose-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                            }">
                                🔴 Forder
                            </button>
                        </div>
                    </div>

                    <!-- Exercises List -->
                    <div class="space-y-4">
                        ${exercisesHtml}
                    </div>
                </div>
            `;
        }

        function setDifficulty(diff) {
            currentDifficulty = diff;
            renderActiveTopic();
        }

        // Check logic for Multiple Choice
        function checkMC(exId, selectedOpt, correctAns) {
            const topic = CURRICULUM_DATA.find(t => t.id === currentTopicId);
            let ex = null;
            ['basis', 'standard', 'forder'].forEach(d => {
                const found = topic.exercises[d].find(e => e.id === exId);
                if (found) ex = found;
            });

            const feedback = document.getElementById(`feedback-${exId}`);
            feedback.classList.remove('hidden', 'bg-rose-50', 'text-rose-900', 'bg-emerald-50', 'text-emerald-900');

            if (selectedOpt === correctAns) {
                feedback.classList.add('bg-emerald-50', 'text-emerald-900', 'border', 'border-emerald-200');
                feedback.innerHTML = `
                    <div class="font-bold mb-1"><i class="fas fa-check-circle text-emerald-600"></i> Perfekt, das ist richtig!</div>
                    <div class="text-xs text-emerald-800">${ex.explanation}</div>
                `;
                markExerciseCompleted(exId);
            } else {
                feedback.classList.add('bg-rose-50', 'text-rose-900', 'border', 'border-rose-200');
                feedback.innerHTML = `
                    <div class="font-bold mb-1"><i class="fas fa-times-circle text-rose-600"></i> Noch nicht ganz. Versuche es gleich noch einmal!</div>
                    <div class="text-xs text-rose-800">Tipp: Lies die Frage und den Merkkasten noch einmal aufmerksam durch.</div>
                `;
            }
        }

        // Check logic for Text Input
        function checkInput(exId, correctAns) {
            const valInput = document.getElementById(`input-${exId}`).value.trim();
            const topic = CURRICULUM_DATA.find(t => t.id === currentTopicId);
            let ex = null;
            ['basis', 'standard', 'forder'].forEach(d => {
                const found = topic.exercises[d].find(e => e.id === exId);
                if (found) ex = found;
            });

            const feedback = document.getElementById(`feedback-${exId}`);
            feedback.classList.remove('hidden', 'bg-rose-50', 'text-rose-900', 'bg-emerald-50', 'text-emerald-900');

            // Normalized string comparison
            const normUser = valInput.toLowerCase().replace(/\s+/g, '');
            const normCorrect = correctAns.toLowerCase().replace(/\s+/g, '');

            if (normUser === normCorrect || (normUser.length > 2 && normCorrect.includes(normUser))) {
                feedback.classList.add('bg-emerald-50', 'text-emerald-900', 'border', 'border-emerald-200');
                feedback.innerHTML = `
                    <div class="font-bold mb-1"><i class="fas fa-check-circle text-emerald-600"></i> Hervorragend! Richtiges Ergebnis.</div>
                    <div class="text-xs text-emerald-800">${ex.explanation}</div>
                `;
                markExerciseCompleted(exId);
            } else {
                feedback.classList.add('bg-rose-50', 'text-rose-900', 'border', 'border-rose-200');
                feedback.innerHTML = `
                    <div class="font-bold mb-1"><i class="fas fa-times-circle text-rose-600"></i> Das stimmt leider noch nicht.</div>
                    <div class="text-xs text-rose-800">Deine Eingabe: "${valInput}". Überprüfe deinen Rechenweg oder deine Schreibweise.</div>
                `;
            }
        }

        function markExerciseCompleted(exId) {
            completedExercises[exId] = true;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(completedExercises));
            
            const badge = document.getElementById(`badge-${exId}`);
            if (badge) badge.classList.remove('hidden');

            const card = document.getElementById(`ex-card-${exId}`);
            if (card) card.className = "bg-white rounded-3xl p-6 shadow-sm border border-emerald-300 bg-emerald-50/20 transition-all";

            updateGlobalProgress();
            renderTopicList();
        }

        function renderHomeworkTab(topic) {
            const zone = document.getElementById('tab-content-zone');
            const sheet = topic.homework[activeHomeworkIndex] || topic.homework[0];

            let tasksHtml = sheet.tasks.map((taskText, idx) => `
                <div class="mb-6">
                    <p class="font-bold text-slate-900 text-sm sm:text-base leading-snug whitespace-pre-line mb-3">${taskText}</p>
                    <div class="space-y-2">
                        <div class="writing-line"></div>
                        <div class="writing-line"></div>
                    </div>
                </div>
            `).join('');

            zone.innerHTML = `
                <div class="space-y-6">
                    <!-- Homework Selection Controls -->
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-4 no-print">
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg">Arbeitsblatt auswählen</h3>
                            <p class="text-xs text-slate-500">Druckfertig aufbereitet für Hausaufgaben & Unterricht</p>
                        </div>

                        <div class="flex items-center space-x-3">
                            <select onchange="changeHomeworkIndex(this.value)" class="bg-slate-100 font-bold text-slate-800 text-xs py-2.5 px-4 rounded-xl border-none focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                ${topic.homework.map((h, i) => `
                                    <option value="${i}" ${i === activeHomeworkIndex ? 'selected' : ''}>${h.title}</option>
                                `).join('')}
                            </select>

                            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition-all shadow-md flex items-center space-x-2">
                                <i class="fas fa-print"></i>
                                <span>Arbeitsblatt drucken</span>
                            </button>
                        </div>
                    </div>

                    <!-- Printable Worksheet Container -->
                    <div class="printable-sheet bg-white rounded-3xl p-8 sm:p-12 shadow-sm border border-slate-200/80">
                        
                        <!-- Header für gedrucktes Blatt -->
                        <div class="border-b-2 border-slate-900 pb-4 mb-8">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h1 class="text-xl font-extrabold text-slate-900 uppercase tracking-tight">Grundschule RoSchu Bayern</h1>
                                    <p class="text-xs font-bold text-slate-600 mt-0.5">Fach: ${topic.subjectName} • 3. Klasse • LehrplanPlus</p>
                                </div>
                                <div class="text-right text-xs font-semibold text-slate-700 space-y-1">
                                    <p>Name: ___________________________</p>
                                    <p>Datum: __________________________</p>
                                </div>
                            </div>
                            <h2 class="text-lg font-bold text-indigo-900 mt-2">${sheet.title}</h2>
                        </div>

                        <!-- Tasks List -->
                        <div class="mt-6">
                            ${tasksHtml}
                        </div>

                        <!-- Footer -->
                        <div class="mt-12 pt-4 border-t border-slate-200 flex justify-between text-[10px] text-slate-400">
                            <span>RoSchu Lernportal Bayern • 3. Klasse</span>
                            <span>Seite 1 von 1</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeHomeworkIndex(idx) {
            activeHomeworkIndex = parseInt(idx, 10);
            renderHomeworkTab(CURRICULUM_DATA.find(t => t.id === currentTopicId));
        }

        function updateGlobalProgress() {
            let total = 0;
            let done = 0;

            CURRICULUM_DATA.forEach(topic => {
                ['basis', 'standard', 'forder'].forEach(diff => {
                    topic.exercises[diff].forEach(ex => {
                        total++;
                        if (completedExercises[ex.id]) done++;
                    });
                });
            });

            const percent = Math.round((done / total) * 100);

            const bar = document.getElementById('global-progress-bar');
            const text = document.getElementById('global-progress-text');

            if (bar) bar.style.width = `${percent}%`;
            if (text) text.innerText = `${percent}%`;
        }

        function resetAllProgress() {
            if (confirm("Möchtest du deinen gesamten Lernfortschritt wirklich zurücksetzen?")) {
                completedExercises = {};
                localStorage.removeItem(STORAGE_KEY);
                updateGlobalProgress();
                renderTopicList();
                renderActiveTopic();
            }
        }
    </script>
</body>
</html>
